events {}

http {
    # The CA service inside the stack. Compose's internal DNS resolves "ca".
    upstream ca_upstream {
        server ca:8000;
    }

    # Plain HTTP on :80 exists only to answer ACME HTTP-01 challenges (the CA
    # serves them itself) and to push every other request to HTTPS.
    server {
        listen 80;
        server_name _;

        # The private enrollment API is available only through its separate listener.
        location = /acme { return 404; }
        location ^~ /acme/ { return 404; }

        location /.well-known/acme-challenge/ {
            proxy_pass http://ca_upstream;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /crl/ {
            # CRLs are read-only; reject anything but GET/HEAD at the edge.
            limit_except GET {
                deny all;
            }
            proxy_pass http://ca_upstream;
        }

        location /ocsp {
            proxy_pass http://ca_upstream;
        }

        location /aia/ {
            # Issuer certs are read-only; reject anything but GET/HEAD at the edge.
            limit_except GET {
                deny all;
            }
            proxy_pass http://ca_upstream;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        # The private enrollment API is available only through its separate listener.
        location = /acme { return 404; }
        location ^~ /acme/ { return 404; }

        # Operator-provided cert/key, mounted read-only by docker-compose.yml.
        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # p12 / cert uploads can be larger than nginx's 1m default.
        client_max_body_size 8m;

        location / {
            proxy_pass http://ca_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            # The app sees plain HTTP from nginx but the client is on HTTPS, so
            # session cookies must be Secure (MYOWNCA_SESSION_COOKIE_SECURE=true).
            proxy_set_header X-Forwarded-Proto https;
            # ACME issuance (esp. DNS-01 propagation) runs synchronously over the
            # request, well past nginx's 60s default — give it room.
            proxy_connect_timeout 30s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }
    }
}
