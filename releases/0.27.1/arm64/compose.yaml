services:
  ca:
    image: "docker.io/enigmais/myownca@sha256:880a0937587732fbd65c0e5077a3c6ab541e29bdc59db3174159a3f6b180507b"
    platform: "linux/arm64"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      MYOWNCA_SESSION_COOKIE_SECURE: "true"
    volumes:
      - myownca-state:/var/lib/myownca
    ports:
      - "127.0.0.1:8765:8765"
    restart: unless-stopped
    networks: [internal]
  proxy:
    image: "nginx:stable@sha256:42c68eab6f7e22611786a9fe1d1c019e275c50185bd54b8f75dc2b9184322703"
    platform: "linux/arm64"
    depends_on: [ca]
    ports: ["80:80", "443:443"]
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./tls/tls.crt
        target: /etc/nginx/tls/tls.crt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./tls/tls.key
        target: /etc/nginx/tls/tls.key
        read_only: true
        bind: {create_host_path: false}
    restart: unless-stopped
    networks: [internal]
volumes:
  myownca-state:
    external: true
    name: myownca-state
networks:
  internal:
