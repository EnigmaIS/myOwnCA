[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "myownca-license-issuer"
version = "0.1.0"
description = "Vendor-only offline license issuer for myOwnCA"
requires-python = ">=3.12"
dependencies = ["cryptography>=43.0.0"]

[project.scripts]
myownca-license = "license_issuer.cli:main"
myownca-license-keygen = "license_issuer.cli:keygen_main"
myownca-license-sign = "license_issuer.cli:sign_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Match the repository's established checks across Ruff versions.
select = ["E4", "E7", "E9", "F"]
