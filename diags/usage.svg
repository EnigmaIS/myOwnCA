<svg viewBox="0 0 1240 1250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="utl udc">
<title id="utl">How myOwnCA is used</title>
<desc id="udc">myOwnCA is an issuing sub-CA that you run yourself. Its private key is protected by whichever store you choose: a cloud vault (AWS KMS or Azure Key Vault), a cryptographic smartcard such as SmartCard-HSM, NitroKey HSM or YubiHSM, an enterprise HSM such as Thales or Gemalto, or an encrypted local file for a homelab. An offline root signs the sub-CA; everything after that is managed locally through web portals, with dual-control approvals and cryptographically signed audit trails. The sub-CA issues certificates to staff, devices, internal services and external partners, and publishes CRL and OCSP revocation status. Those certificates unlock mutual-TLS (mTLS) client authentication to web resources as a second factor, S/MIME email that is signed and encrypted so only the recipient can read it and whose integrity can be checked, certificate-based Wi-Fi and VPN login providing multi-factor authentication, and server HTTPS. The product is built against PCI PIN, PCI P2PE and a range of ISO banking and key-management standards. Day to day the lifecycle is automated: request, approve, issue, deliver, renew and revoke, with expiry reminders, ACME auto-renewal and published revocation status.</desc>
<style>
