</style>
<defs>
<marker id="aBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="aGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6E6D68" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text x="40" y="42" class="h1">myOwnCA — your own certificate authority, end to end</text>
<text x="40" y="66" class="ts">Choose how the CA key is protected, run the CA yourself, and issue certificates your people and devices actually use.</text>

<!-- ============ 1 · key protection ============ -->
<text x="40" y="118" class="hd">1 · WHERE THE CA's PRIVATE KEY LIVES</text>
<text x="40" y="136" class="tx">Pick one. The CA works the same either way.</text>

<rect x="40" y="152" width="250" height="68" rx="8" class="gray"/>
<text x="56" y="176" class="th">Cloud vault</text>
<text x="56" y="196" class="ts">AWS KMS or Azure Key Vault</text>
<text x="56" y="212" class="tx">the key never leaves the provider</text>

<rect x="40" y="232" width="250" height="92" rx="8" class="gray"/>
<text x="56" y="256" class="th">Cryptographic Smartcard</text>
<text x="56" y="276" class="tx">your key lives on hardware:</text>
<text x="56" y="292" class="tx">SmartCard-HSM, NitroKey HSM,</text>
<text x="56" y="308" class="tx">YubiHSM or any PKCS#11 smartcard</text>

<rect x="40" y="336" width="250" height="68" rx="8" class="gray"/>
<text x="56" y="360" class="th">Hardware HSM</text>
<text x="56" y="380" class="tx">enterprise HSM device:</text>
<text x="56" y="396" class="tx">Thales / Gemalto support</text>

<rect x="40" y="416" width="250" height="68" rx="8" class="gray"/>
<text x="56" y="440" class="th">Encrypted file</text>
<text x="56" y="460" class="ts">on the server itself</text>
<text x="56" y="476" class="tx">simplest — ideal for a homelab</text>

<path class="flow" d="M294 310 L336 310"/>
<text x="296" y="302" class="lbl">protects</text>

<!-- ============ 2 · your own CA ============ -->
<rect x="342" y="104" width="318" height="452" rx="10" class="region"/>
<text x="358" y="126" class="hd">2 · YOUR OWN CA</text>
<text x="358" y="144" class="tx">On your hardware, under your control.</text>

<rect x="362" y="158" width="278" height="72" rx="8" class="offline"/>
<text x="378" y="182" class="th">Offline root CA</text>
<text x="378" y="202" class="tx">air-gapped; signs only the sub-CA,</text>
<text x="378" y="218" class="tx">then goes back in the safe</text>

<path class="step" d="M501 234 L501 256"/>

<rect x="362" y="262" width="278" height="96" rx="8" class="accent"/>
<text x="378" y="288" class="tb">myOwnCA issuing sub-CA</text>
<text x="378" y="308" class="ts">signs every certificate you hand out</text>
<text x="378" y="326" class="tx">no third party involved, no per-certificate fees</text>
<text x="378" y="344" class="tx">provides CRLs and/or OCSP verification</text>

<rect x="362" y="372" width="278" height="62" rx="8" class="blue"/>
<text x="378" y="394" class="th">Browser portals</text>
<text x="378" y="414" class="tx">separate views for admins, operators</text>
<text x="378" y="428" class="tx">and holders</text>

<rect x="362" y="448" width="278" height="94" rx="8" class="blue"/>
<text x="378" y="470" class="th">Approvals &amp; audit trail</text>
<text x="378" y="490" class="tx">requires dual-control, and records</text>
<text x="378" y="506" class="tx">cryptographically signed audit trails</text>
<text x="378" y="522" class="tx">as required by ISO 16609 — banking</text>
<text x="378" y="536" class="tx">message authentication</text>

<path class="flow" d="M664 310 L706 310"/>
<text x="666" y="302" class="lbl">issues to</text>

<!-- ============ issued to ============ -->
<text x="712" y="118" class="hd">ISSUED TO</text>
<text x="712" y="136" class="tx">Inside and outside the organisation.</text>

<rect x="712" y="152" width="216" height="62" rx="8" class="blue"/>
<text x="728" y="176" class="th">People</text>
<text x="728" y="196" class="tx">staff, contractors</text>

<rect x="712" y="232" width="216" height="62" rx="8" class="blue"/>
<text x="728" y="256" class="th">Devices</text>
<text x="728" y="276" class="tx">laptops, phones, servers</text>

<rect x="712" y="312" width="216" height="62" rx="8" class="blue"/>
<text x="728" y="336" class="th">Services</text>
<text x="728" y="356" class="tx">web, mail, VPN endpoints</text>

<rect x="712" y="392" width="216" height="62" rx="8" class="blue"/>
<text x="728" y="416" class="th">External parties</text>
<text x="728" y="436" class="tx">partners, suppliers</text>

<path class="flow" d="M932 310 L974 310"/>
<text x="934" y="302" class="lbl">unlocks</text>

<!-- ============ 3 · what it unlocks ============ -->
<text x="980" y="118" class="hd">3 · WHAT THEY UNLOCK</text>
<text x="980" y="136" class="tx">The reason to run a CA at all.</text>

<rect x="980" y="152" width="222" height="68" rx="8" class="accent"/>
<text x="996" y="176" class="th">mTLS client authentication</text>
<text x="996" y="196" class="tx">reach internal or public web</text>
<text x="996" y="212" class="tx">resources with MFA</text>

<rect x="980" y="232" width="222" height="84" rx="8" class="accent"/>
<text x="996" y="256" class="th">Secure email (S/MIME)</text>
<text x="996" y="276" class="tx">sign and encrypt mail so only</text>
<text x="996" y="292" class="tx">the recipient can read it, and</text>
<text x="996" y="308" class="tx">check integrity of the message</text>

<rect x="980" y="328" width="222" height="68" rx="8" class="accent"/>
<text x="996" y="352" class="th">Wi-Fi and VPN access</text>
<text x="996" y="372" class="tx">certificate-based login</text>
<text x="996" y="388" class="tx">providing MFA</text>

<rect x="980" y="408" width="222" height="68" rx="8" class="accent"/>
<text x="996" y="432" class="th">Server HTTPS</text>
<text x="996" y="452" class="tx">trusted inside your own</text>
<text x="996" y="468" class="tx">network, on your own terms</text>

<!-- ============ regulated environments ============ -->
<rect x="40" y="586" width="1162" height="96" rx="10" class="gray"/>
<text x="62" y="612" class="hd">BUILT TO BE EASY TO DEPLOY AND USE FROM PoC LABS/HOMELABS TO REGULATED ENVIRONMENTS*</text>
<text x="62" y="638" class="th">Docker or bare-metal build — your choice.</text>
<text x="62" y="662" class="ts">A browser wizard does the setup, and day-to-day work never leaves the portal — with the key protection, dual control and signed audit trail that regulated environments expect.</text>

<!-- ============ 4 · lifecycle ============ -->
<rect x="40" y="700" width="1162" height="276" rx="10" class="region"/>
<text x="60" y="730" class="hd">4 · EVERYDAY OPERATION — AUTOMATED</text>
<text x="60" y="750" class="ts">The whole life of a certificate, driven from the browser. Nothing here needs OpenSSL on the command line.</text>

<rect x="60" y="770" width="166" height="92" rx="8" class="blue"/>
<text x="76" y="794" class="th">Request</text>
<text x="76" y="814" class="tx">holder asks through the</text>
<text x="76" y="830" class="tx">portal, or an operator</text>
<text x="76" y="846" class="tx">creates it for them</text>
<path class="step" d="M230 816 L252 816"/>

<rect x="256" y="770" width="166" height="92" rx="8" class="blue"/>
<text x="272" y="794" class="th">Approve</text>
<text x="272" y="814" class="tx">as many operators as</text>
<text x="272" y="830" class="tx">you require must agree</text>
<text x="272" y="846" class="tx">before anything is signed</text>
<path class="step" d="M426 816 L448 816"/>

<rect x="452" y="770" width="166" height="92" rx="8" class="accent"/>
<text x="468" y="794" class="th">Issue</text>
<text x="468" y="814" class="tx">signed by the key you</text>
<text x="468" y="830" class="tx">chose in step 1; automatic</text>
<text x="468" y="846" class="tx">once approved</text>
<path class="step" d="M622 816 L644 816"/>

<rect x="648" y="770" width="166" height="92" rx="8" class="blue"/>
<text x="664" y="794" class="th">Deliver</text>
<text x="664" y="814" class="tx">emailed with the CA</text>
<text x="664" y="830" class="tx">certificates; password</text>
<text x="664" y="846" class="tx">sent by SMS separately</text>
<path class="step" d="M818 816 L840 816"/>

<rect x="844" y="770" width="166" height="92" rx="8" class="blue"/>
<text x="860" y="794" class="th">Renew</text>
<text x="860" y="814" class="tx">reminders before expiry;</text>
<text x="860" y="830" class="tx">public certificates renew</text>
<text x="860" y="846" class="tx">themselves via ACME</text>
<path class="step" d="M1014 816 L1036 816"/>

<rect x="1040" y="770" width="162" height="92" rx="8" class="blue"/>
<text x="1056" y="794" class="th">Revoke</text>
<text x="1056" y="814" class="tx">one click; CRL and</text>
<text x="1056" y="830" class="tx">OCSP are published</text>
<text x="1056" y="846" class="tx">straight away</text>

<rect x="60" y="882" width="1142" height="74" rx="8" class="gray"/>
<text x="78" y="906" class="th">Lost or stolen device?</text>
<text x="78" y="926" class="ts">Revoke the certificate and that person or machine loses access immediately — no password to change, no shared secret to rotate</text>
<text x="78" y="944" class="tx">across every other system. Issue a replacement from the same screen.</text>


<!-- ============ footnote ============ -->
<text x="62" y="1004" class="fineh">* built in accordance to:</text>
<text x="62" y="1024" class="finek">Payment Card Industry Data Security Standard<tspan class="fine" dx="5">(PCI DSS)</tspan></text>
<text x="62" y="1039" class="finek">Payment Card Industry PIN Security Standard<tspan class="fine" dx="5">(PCI PIN)</tspan></text>
<text x="62" y="1054" class="finek">Payment Card Industry Point-to-Point Encryption Standard<tspan class="fine" dx="5">(PCI P2PE)</tspan></text>
<text x="62" y="1069" class="finek">ISO 9564:<tspan class="fine" dx="5">Financial services – Personal Identification Number Management and Security</tspan></text>
<text x="62" y="1084" class="finek">ISO 11568:<tspan class="fine" dx="5">Banking – Key Management (Retail)</tspan></text>
<text x="62" y="1099" class="finek">ISO 11770–2:<tspan class="fine" dx="5">Information Technology – Security Techniques – Key Management, Part 2: Mechanisms Using Symmetric Key Management Techniques</tspan></text>
<text x="62" y="1114" class="finek">ISO 11770–3:<tspan class="fine" dx="5">Information Technology – Security Techniques – Key Management, Part 3: Mechanisms Using Asymmetric Techniques (RSA and Diffie-Hellman)</tspan></text>
<text x="62" y="1129" class="finek">ISO 13491:<tspan class="fine" dx="5">Banking – Secure Cryptographic Devices (Retail)</tspan></text>
<text x="62" y="1144" class="finek">ISO TR 14742:<tspan class="fine" dx="5">Financial services – Recommendations on cryptographic algorithms and their use</tspan></text>
<text x="62" y="1159" class="finek">ISO 16609:<tspan class="fine" dx="5">Banking – Requirements for message authentication using symmetric techniques</tspan></text>
<text x="62" y="1174" class="finek">ISO 18031:<tspan class="fine" dx="5">Information technology – Security techniques – Random bit generation</tspan></text>
<text x="62" y="1189" class="finek">ISO/IEC 18033-3:<tspan class="fine" dx="5">Information Technology – Security techniques – Encryption algorithms – Part 3: Block Ciphers</tspan></text>
<text x="62" y="1204" class="finek">ISO TR 19038:<tspan class="fine" dx="5">Guidelines on Triple DEA Modes of Operation</tspan></text>
<text x="62" y="1219" class="finek">ISO 20038:<tspan class="fine" dx="5">Banking and related financial services – Key wrap using AES</tspan></text>

</svg>
