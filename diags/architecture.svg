.gray{fill:#EFEEE7;stroke:#9a988f;stroke-width:.75}
.region{fill:none;stroke:#b4b2a9;stroke-width:.75;stroke-dasharray:1 6}
.dash{stroke-dasharray:5 4}
</style>
