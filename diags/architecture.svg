<svg viewBox="0 0 1200 960" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
<title id="ttl">myOwnCA merged architecture and feature flow</title>
<desc id="dsc">Web clients call online/app.py, which drives two parallel issuance lanes: an internal CA lane (CAMainService, policy, crypto) that signs through the HSM layer (HSMProxy over a software keystore or a PKCS#11/OpenSC token), and an external lane (service_certs, ACME client) that obtains certificates from public CAs. Issued material is exported and delivered, persisted to the data layer, and the issuing sub-CA is provisioned from an air-gapped offline root via signed transfer bundles. Auth, audit, notifications, comms and licensing are cross-cutting.</desc>
